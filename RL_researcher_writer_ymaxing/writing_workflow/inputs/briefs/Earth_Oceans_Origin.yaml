lesson_number: 8
title: Where Did Earth Get Its Oceans? Maybe It Made Them Itself.
topic_summary:
  "Plan a lesson contrasting comets versus asteroids as sources of Earth's water, using D/H ratio isotopic evidence
  from missions like Giotto, Rosetta, and sample returns from Ryugu and Winchcombe meteorites. Introduce the emerging endogenous
  water production mechanism via high-pressure hydrogen-magma ocean reactions, grounded in exoplanet observations, enstatite
  chondrite reanalysis, and recent diamond-anvil/laser experiments. Conclude by weighing the mixed-source hypothesis against
  ongoing uncertainties in late bombardment and atmospheric retention, plus implications for planetary habitability.

  "
