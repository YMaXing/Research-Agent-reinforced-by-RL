sections:
  - title: Introduction
    target_words: 365
    key_points:
      - NASA Europa mission and Ada Limón poem as hook illustrating water's universal role in uniting search for life
      - Surprising scientific uncertainty about Earth's ocean origins despite decades of solar-system exploration
      - Historical preference for comets, shift to asteroids after D/H mismatches, and rise of indigenous water-production theory
      - Role of spacecraft flybys, meteorite forensics, exoplanet statistics, and high-pressure lab experiments in reshaping the
        narrative
  - title: A Showdown Between Comets and Asteroids
    target_words: 918
    key_points:
      - "Comets as early frontrunner: formation in Kuiper Belt/Oort cloud, high water yield, 'bang for buck' delivery potential"
      - "D/H ratio diagnostic: Giotto Halley encounter, Hale-Bopp spectroscopy, and Rosetta 67P results all showing elevated deuterium
        versus Earth"
      - "Asteroid counter-case: frequent impacts, meteorite collections, Winchcombe D/H match, and Hayabusa2 Ryugu sample confirmation"
      - "Persistent asteroid shortcomings: noble-gas tracer mismatches and dependence on debated late veneer bombardment"
      - Pivot to radical alternative — Earth generating its own water internally rather than relying on exogenous delivery
  - title: Hydrogen, Meet Magma
    target_words: 821
    key_points:
      - Reevaluation of enstatite chondrites revealing hidden hydrogen in organics, silicates, and sulfides
      - Inference of hydrogen-rich early atmospheres on rocky worlds drawn from exoplanet formation simulations
      - "Core mechanism: high-pressure hydrogen reacting with oxygen in magma ocean under extreme conditions"
      - Lab breakthroughs using diamond anvils and lasers to replicate sub-Neptune environments, yielding up to 1000× predicted
        water
      - "Applicability debate for Earth-mass planets: hydrogen retention limits, required pressure thresholds, and reaction timescale
        sufficiency"
      - Broad habitability implication that many rocky planets may be 'born water-rich' without external delivery
  - title: Drowning in a Sea of Possibilities
    target_words: 302
    key_points:
      - Comet resurgence via Hartley 2 Herschel data, reanalysis of Rosetta 67P dust contamination, and 12P/Pons-Brooks Earth-like
        D/H
      - "Mixed-source synthesis: probable combination of comets, asteroids, and indigenous production"
      - Complicating factors of post-delivery geological, atmospheric, and biological processing that obscure original signatures
      - "Parallel to origin-of-life question: increasing knowledge yields richer, more nuanced story rather than final certainty"
