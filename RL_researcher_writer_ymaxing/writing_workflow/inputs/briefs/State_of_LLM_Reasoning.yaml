  - title: "s1: Simple test-time scaling"
    target_words: 429
    key_points:
      - Hybrid approach using curated 1k-example SFT dataset of reasoning traces plus inference-time length control
      - Mechanism of 'wait' tokens to encourage self-verification and self-correction versus end-of-thinking delimiters
      - Budget forcing as a sequential scaling technique contrasted with parallel methods like majority voting
      - Observed correlation between generated response length and accuracy on reasoning benchmarks
      - Limitations and desired comparisons to beam search, lookahead, compute-optimal search, and basic CoT
      - Connection to DeepSeek-R1 'Aha moment' and empirical comparison of 'Wait' versus 'Hmm' tokens
