  - title: Other noteworthy research papers on inference-time compute scaling
    target_words: 141
    key_points:
      - Rationale for keeping summaries brief given the high volume of recent papers
      - Common pattern that many papers blend some training with explicit control of inference-time compute
      - Differentiation from distillation or SFT approaches that merely produce longer outputs without active length regulation
        during inference
  - title: Test-Time Preference Optimization
    target_words: 122
    key_points:
      - Iterative on-the-fly alignment process that avoids changing underlying model weights
      - Use of reward model to select chosen and rejected responses then generate textual critiques and suggestions
      - Four-step loop of generation, scoring, critique, and refinement that repeats to improve outputs
    diagrams:
