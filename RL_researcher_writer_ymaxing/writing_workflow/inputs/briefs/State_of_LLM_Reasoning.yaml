  - title: Inference-time compute scaling methods
    target_words: 188
    key_points:
      - Core idea that extra inference compute lets models think longer, analogous to humans taking more time
      - Classic prompt engineering approaches like chain-of-thought and their impact on token count and cost
      - Search and voting strategies such as majority voting and beam search guided by process reward models
      - Distinction between sequential (one-token-at-a-time extension) and parallel (multiple independent generations) scaling
    diagrams:
