  - title: Thoughts Are All Over the Place
    target_words: 100
    key_points:
      - Underthinking phenomenon in o1-like models where frequent reasoning path switches reduce accuracy
      - Thought Switching Penalty (TIP) method that modifies logits to discourage premature path transitions
      - No-fine-tuning approach that improves accuracy on challenging benchmarks by promoting deeper exploration of promising
        paths
    diagrams:
      - Visualization of the Thought Switching Penalty mechanism for penalizing early reasoning path changes
  - title: Trading Inference-Time Compute for Adversarial Robustness
    target_words: 126
    key_points:
      - How increased inference-time compute generally reduces successful attack rates without adversarial training
      - Important exceptions and limited gains in policy ambiguity or loophole exploitation scenarios
      - New attack strategies like Think Less and Nerd Sniping that can counteract robustness gains
      - Conclusion that inference scaling helps but is not a complete standalone solution for LLM safety
    diagrams:
      - Analysis figure showing trade-off between inference compute and adversarial robustness across attack types
  - title: Chain-of-Associated-Thoughts
    target_words: 73
    key_points:
      - Combination of Monte Carlo Tree Search with associative memory acting as dynamic knowledge base
      - Benefit of associative memory for recalling earlier reasoning paths and incorporating evolving information
      - How the framework aids exploration of reasoning pathways during inference
    diagrams:
      - Framework visualization of Chain-of-Associated-Thoughts integrating MCTS with associative memory
  - title: Step Back to Leap Forward
    target_words: 169
    key_points:
      - Self-backtracking mechanism that teaches models when and where to revise suboptimal paths
      - Training with special backtrack token versus the key inference-time tree-based search contribution
      - Advantage of not requiring external reward models unlike standard process-reward-guided search
      - Dynamic adjustment of search depth and breadth using the learned backtracking ability
    diagrams:
      - Diagram of the self-backtracking mechanism including training with backtrack token and inference-time search
  - title: Scaling up Test-Time Compute with Latent Reasoning
    target_words: 108
    key_points:
      - Recurrent depth approach that iterates in latent space instead of generating more tokens
      - Hidden-state-like behavior similar to RNNs for refining reasoning without increasing output length
      - Major drawback of missing explicit reasoning steps that aid human interpretability
    diagrams:
      - Visualization of recurrent depth block for scaling test-time compute in latent space
  - title: Can a 1B LLM Surpass a 405B LLM?
    target_words: 146
    key_points:
      - Systematic study of interactions between inference-time scaling, process reward models, and problem difficulty
      - Compute-optimal scaling strategy that adapts to PRM choice, policy model size, and task complexity
      - Evidence that a 1B model with proper scaling can outperform 405B Llama 3 without scaling
      - Broader implication that right inference budget lets small models surpass much larger unscaled models
    diagrams:
      - Comparison plot of compute-optimal test-time scaling showing small models outperforming large ones
  - title: Learning to Reason from Feedback at Test-Time
    target_words: 157
    key_points:
      - Challenge of classifying as pure inference-time or training-time since it updates weights during inference
      - OpTune optimizer that adjusts model weights based on previous mistakes without storing failed attempts in context
      - Contrast with sequential revision (adding attempts to prompt) and parallel sampling approaches
      - Benefit of remembering errors via weight updates rather than growing context length
    diagrams:
