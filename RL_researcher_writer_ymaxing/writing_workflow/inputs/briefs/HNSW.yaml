  - title: Foundations of HNSW
    target_words: 897
    key_points:
      - "Positioning HNSW in ANN landscape: graph category, proximity graphs where edges reflect Euclidean closeness"
      - "Probability skip lists: layered linked-list structure enabling both fast search (top-layer long jumps) and fast insertion"
      - "Navigable Small World graphs: long-range plus short-range friend-list links producing logarithmic greedy-routing complexity"
      - "Greedy routing details: zoom-out (low-degree vertices) vs zoom-in (high-degree) phases, local-minima stopping condition
        and early-stop risk"
      - "Hierarchy as the key innovation: skip-list layering applied to NSW so search begins with long links and progressively
        refines accuracy"
      - "Degree vs. performance tradeoff: higher average degree improves recall but raises network complexity and query time"
    diagrams:
      - "Probability skip list diagram: top layer with long skips descending to bottom layer with single-step links, illustrating
        search path"
      - "NSW search flowchart: entry-point start, iterative greedy moves to nearest friend, termination at local minimum"
      - High-degree vs low-degree vertex contrast showing impact on routing phases and early stopping probability
      - "HNSW layered graph: longest links at top layer (entry point), progressively shorter and denser links at lower layers"
      - "Full HNSW search process: start at top layer, greedy traversal per layer, descend on local minimum until layer 0"
  - title: Graph Construction
    target_words: 342
    key_points:
      - Iterative one-by-one vector insertion and role of L (max layers) with probabilistic layer assignment
      - Level multiplier m_L (~1/ln(M)) and its effect on minimizing neighbor overlap across layers while controlling traversal
        count
      - "Construction search phases: initial ef=1 greedy traversal to locate insertion layer, then efConstruction for richer candidate
        set"
      - "Link selection from candidates: choose M nearest, respect M_max and M_max0 caps (doubled for base layer)"
      - How construction mirrors search but uses higher efConstruction to improve connectivity before final layer-0 local minimum
        stop
    diagrams:
      - Probability function plot across layers showing exponential decay and insertion likelihood per level
      - Link assignment diagram illustrating M neighbors, M_max cap, M_max0 doubling for layer 0, and effect on vertex degrees
  - title: Implementation of HNSW
    target_words: 1184
    key_points:
      - Faiss IndexHNSWFlat initialization with vector dimension and M (neighbors per vertex)
      - Automatic derivation of layer probabilities, M_max/M_max0, and entry-point selection inside set_default_probas
      - "Inspecting built index: max_level, level distribution histogram, and entry-point vector ID"
      - Reproducing probability and random_level logic to reveal why most vectors land in layer 0 and highest layer always has
        an entry point
      - Parameter sweep on Sift1M (M, efConstruction, efSearch) measuring effects on recall@1, latency, and memory footprint
      - "Observed tradeoffs: high M and efSearch drive recall but explode latency and RAM; efConstruction helps recall with modest
        latency cost at low query volumes"
      - "Mitigation strategies when HNSW memory is prohibitive: add PQ compression or IVF clustering for composite indexes"
