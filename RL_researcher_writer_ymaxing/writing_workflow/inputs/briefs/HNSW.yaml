lesson_number: 4
title: Hierarchical Navigable Small Worlds (HNSW)
topic_summary:
  "Introduce HNSW as a leading graph-based ANN method for vector similarity search that delivers SOTA recall
  and speed. Cover its foundations in probability skip lists (multi-layer linked lists for fast search/insert) and navigable
  small world graphs (long/short-range links enabling logarithmic greedy routing). Detail the hierarchical layering that combines
  these ideas, the iterative graph construction algorithm, and how search traverses from long-range top layers to precise
  bottom layers. Explore Faiss implementation details, key parameters (M, efConstruction, efSearch), observed tradeoffs, and
  techniques like PQ or IVF to tune memory and speed.

  "
why_valuable:
  "HNSW powers high-performance vector databases and retrieval systems used in production RAG and semantic search
  applications. AI engineers who master its layered proximity graph mechanics and parameter effects can make better decisions
  on index selection, optimize the recall-latency-memory tradeoff, and debug or extend ANN systems effectively.

  "
target_length_words: 2529
theory_practice_ratio: 70% theory - 30% practice
lesson_scope:
  "This lesson follows earlier coverage of simpler ANN indexes (flat, LSH, IVF) in the vector search series and
  precedes lessons on composite indexes (IVF+HNSW) and quantization methods that further tune HNSW tradeoffs.

  "
audience:
  "AI engineers and developers experienced with vector embeddings, basic similarity search, and Faiss who want to
  master advanced graph-based indexes for scalable, low-latency retrieval.

  "
concepts_from_previous_lessons:
  - ANN algorithm categories (trees, hashes, graphs) and proximity graphs
  - Greedy routing, local minima, and recall vs. speed vs. memory tradeoffs in vector indexes
  - Faiss index construction patterns and parameter setting
concepts_for_future_lessons:
  - Composite indexes that wrap HNSW with IVF or other clusterings
  - Product quantization to compress vectors and reduce HNSW memory footprint
  - Systematic benchmarking of HNSW against other ANN methods on real workloads
