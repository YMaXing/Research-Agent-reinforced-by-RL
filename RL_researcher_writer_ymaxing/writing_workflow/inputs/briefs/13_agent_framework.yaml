lesson_number: 13
title: Agent Frameworks Overview & Comparison
topic_summary:
  "Guide engineers in choosing agent frameworks under uncertainty by distinguishing runtimes, protocols (MCP),
  and tooling layers. Introduce four decision axes (control-flow explicitness vs autonomy, reliability primitives, abstraction/DX
  level, tooling interoperability) to replace hype-driven or brand-based selection. Survey the current landscape with adoption
  metrics, then deep-dive into philosophies, core abstractions, strengths, and trade-offs of major options (LangGraph, OpenAI
  Agents SDK, AgentKit, CrewAI, PydanticAI, AutoGen, Claude Agent SDK, FastMCP). Anchor evaluation in capstone needs: flexible
  MCP-driven research agent vs auditable LangGraph-driven writing agent, with a decision matrix and real pivots as concrete
  illustration.

  "
why_valuable:
  "Framework choice directly impacts production viability—poor selections create brittleness, missing durability
  features, vendor lock-in, or excessive overhead. This equips AI engineers with principle-based axes and highlights MCP as
  a portability layer, allowing tools to outlive specific runtimes in a fast-changing ecosystem.

  "
target_length_words: 4471
theory_practice_ratio: 100% theory - 0% practice
lesson_scope:
  "Lesson 13 follows lesson 12's introduction of the two capstone projects and precedes lesson 14's system-design
  framework for models/cost/latency/HITL; it supplies the conceptual scaffolding used in lessons 16-24 when the capstones
  are built end-to-end.

  "
audience:
  "AI engineers who have built basic LLM tool-calling loops and been introduced to the course capstones but need structured
  principles for evaluating production frameworks amid a crowded, evolving landscape.

  "
concepts_from_previous_lessons:
  - "Two capstone projects: adaptable/interactive research agent and reliable/auditable writing agent"
  - High-level capstone architecture using hybrid orchestration and portable tools
concepts_for_future_lessons:
  - System-design decision framework covering model selection, cost/latency trade-offs, and HITL gate placement
  - End-to-end Nova implementation as FastMCP server with Perplexity loops and research artifacts
  - End-to-end Brown implementation as LangGraph workflow exposing coarse MCP tools
  - Tools-as-workflows pattern combining durability with IDE-native portability
