  - title: Foundations of Multimodal LLMs
    target_words: 1078
    key_points:
      - "Two primary architectures: unified embedding-decoder (image patches projected and concatenated with text tokens) versus
        cross-modality attention (visual features queried dynamically during decoding)"
      - Image encoder (ViT), patching process analogous to text tokenization, linear projector for shared embedding space
      - Contrastive learning (CLIP-style) to align semantically related image-text pairs in joint vector space
      - Training stages (frozen encoder + projector then end-to-end fine-tuning) and efficiency tradeoffs for high-resolution
        inputs
      - "Distinction from diffusion generative models: focus on reasoning/understanding for agents, not image synthesis"
      - Current open (Llama 4, Qwen) and proprietary (Gemini, Claude) models plus extensibility to audio/video via new encoders
    diagrams:
      - Side-by-side architecture diagrams contrasting unified embedding-decoder (concatenation) versus cross-modality attention
        (dynamic lookup) for multimodal LLMs
      - Image patching and Vision Transformer flow analogous to text tokenization, producing patch embeddings projected into LLM
        space
      - Contrastive learning diagram showing positive/negative pairs pulling semantically similar image-text embeddings closer
        in shared vector space
  - title: Applying Multimodal LLMs to Images and PDFs
    target_words: 1325
    key_points:
