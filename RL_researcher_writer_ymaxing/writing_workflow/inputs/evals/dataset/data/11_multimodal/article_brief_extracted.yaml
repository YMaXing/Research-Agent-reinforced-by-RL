        boxes"
      - Using Pydantic schemas for guaranteed JSON output of detections (ymin/xmin/ymax/xmax + label)
      - "Extending identical patterns to PDFs: native ingestion for summarization and diagram detection without OCR"
      - When to choose each input format in production systems (local testing vs scalable cloud storage)
