context:
  article_guideline_loader: "markdown"
  article_guideline_uri: "article_guideline.md"
  research_loader: "markdown"
  research_uri: "research.md"
  article_loader: "markdown"
  article_renderer: "markdown"
  article_uri: "article.md"
  profiles_loader: "markdown"
  profiles_uri: "inputs/profiles"
  character_profile: "paul_iusztin.md"
  examples_loader: "markdown"
  examples_uri: "inputs/examples/decodingai_articles"
  exploration_examples_uri: "inputs/examples/exploration_integration"
memory:
  checkpointer: "in_memory"
num_reviews: 2
# Shared anchors merged into each node below via `<<:` to avoid repeating the same
# model_id/thinking defaults on every node (ignored by AppConfig's default extra="ignore").
_defaults:
  flash_model: &flash_model
    model_id: "google_genai:gemini-3.7-flash"
  no_thinking: &no_thinking
    include_thoughts: false
    thinking_level: null
nodes:
  generate_media_items:
    <<: *flash_model
    model_config:
      <<: *no_thinking
      temperature: 0.0
    tools:
      mermaid_diagram_generator:
        <<: *flash_model
        config:
          <<: *no_thinking
          temperature: 0.0
  write_article:
    <<: *flash_model
    model_config:
      <<: *no_thinking
      temperature: 0.7
      max_retries: 1
  integrate_exploration:
    <<: *flash_model
    model_config:
      temperature: 1.0
      include_thoughts: true
      thinking_level: "high"
      max_retries: 1
  review_article:
    <<: *flash_model
    model_config:
      <<: *no_thinking
      temperature: 0.0
      max_retries: 1
  edit_article:
    <<: *flash_model
    model_config:
      <<: *no_thinking
      temperature: 0.1
      max_retries: 1
  review_selected_text:
    <<: *flash_model
    model_config:
      <<: *no_thinking
      temperature: 0.0
      max_retries: 1
  edit_selected_text:
    <<: *flash_model
    model_config:
      <<: *no_thinking
      temperature: 0.1
      max_retries: 1
