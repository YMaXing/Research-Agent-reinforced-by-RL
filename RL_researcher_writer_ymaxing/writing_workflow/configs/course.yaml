context:
  article_guideline_loader: "markdown"
  article_guideline_uri: "article_guideline.md"
  research_loader: "markdown"
  research_uri: "research.md"
  article_loader: "markdown"
  article_renderer: "markdown"
  article_uri: "article.md"
  profiles_loader: "markdown"
  profiles_uri: "inputs/profiles"
  character_profile: "paul_iusztin.md"
  examples_loader: "markdown"
  examples_uri: "inputs/examples/course_lessons"
  exploration_examples_uri: "inputs/examples/exploration_integration"
memory:
  checkpointer: "in_memory"
num_reviews: 3
max_reviews_per_iteration: 5
# Shared anchors merged into each node below via `<<:` to avoid repeating the same
# model_id/thinking defaults on every node (ignored by AppConfig's default extra="ignore").
_defaults:
  flash_model: &flash_model
    model_id: "google_genai:gemini-3.7-flash"
  low_thinking: &low_thinking
    include_thoughts: false
    thinking_level: low
  high_thinking: &high_thinking
    include_thoughts: false
    thinking_level: high
nodes:
  generate_media_items:
    <<: *flash_model
    model_config:
      <<: *low_thinking
      temperature: 0.0
      max_retries: 2
    tools:
      mermaid_diagram_generator:
        <<: *flash_model
        config:
          <<: *low_thinking
          temperature: 0.0
          max_retries: 2
  write_article:
    <<: *flash_model
    model_config:
      <<: *high_thinking
      temperature: 0.7
      max_retries: 2
  integrate_exploration:
    <<: *flash_model
    model_config:
      <<: *high_thinking
      temperature: 0.7
      max_retries: 2
  review_article:
    <<: *flash_model
    model_config:
      <<: *high_thinking
      temperature: 0.0
      max_retries: 2
  edit_article:
    <<: *flash_model
    model_config:
      <<: *high_thinking
      temperature: 0.1
      max_retries: 2
  review_selected_text:
    <<: *flash_model
    model_config:
      <<: *high_thinking
      temperature: 0.0
      max_retries: 2
  edit_selected_text:
    <<: *flash_model
    model_config:
      <<: *high_thinking
      temperature: 0.1
      max_retries: 2
