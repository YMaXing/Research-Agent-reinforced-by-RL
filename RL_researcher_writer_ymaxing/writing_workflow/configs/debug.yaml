context:
  article_guideline_loader: "markdown"
  article_guideline_uri: "article_guideline.md"
  research_loader: "markdown"
  research_uri: "research.md"
  article_loader: "markdown"
  article_renderer: "markdown"
  article_uri: "article.md"
  profiles_loader: "markdown"
  profiles_uri: "inputs/profiles"
  character_profile: "paul_iusztin.md"
  examples_loader: "markdown"
  examples_uri: "inputs/examples/debug"
  exploration_examples_uri: "inputs/examples/exploration_integration"
memory:
  checkpointer: "in_memory"
num_reviews: 1
# Shared anchors merged into each node below via `<<:` (ignored by AppConfig's default extra="ignore").
_defaults:
  fake_model: &fake_model
    model_id: "fake"
  no_thinking: &no_thinking
    include_thoughts: false
    thinking_level: null
nodes:
  generate_media_items:
    <<: *fake_model
    model_config:
      <<: *no_thinking
      temperature: 0.0
    tools:
      mermaid_diagram_generator:
        <<: *fake_model
        config:
          <<: *no_thinking
          temperature: 0.0
  write_article:
    <<: *fake_model
    model_config:
      temperature: 0.7
      include_thoughts: false
      thinking_level: "high"
  integrate_exploration:
    <<: *fake_model
    model_config:
      temperature: 1.0
      include_thoughts: true
      thinking_level: "high"
  review_article:
    <<: *fake_model
    model_config:
      <<: *no_thinking
      temperature: 0.0
  edit_article:
    <<: *fake_model
    model_config:
      temperature: 0.1
      include_thoughts: false
      thinking_level: "high"
  review_selected_text:
    <<: *fake_model
    model_config:
      <<: *no_thinking
      temperature: 0.0
  edit_selected_text:
    <<: *fake_model
    model_config:
      temperature: 0.1
      include_thoughts: false
      thinking_level: "high"
