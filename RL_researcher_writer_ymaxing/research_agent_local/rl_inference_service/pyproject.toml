[project]
name = "rl-inference-service"
version = "0.1.0"
description = "Production RL exploration-preset inference + on-the-fly digest generation, spawned by mcp_server's predict_exploration_preset tool"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.5.0",
    "transformers>=4.51.0",
    "peft>=0.15.0",
    "bitsandbytes>=0.45.0",
    "accelerate>=1.5.0",
    "setuptools>=82.0.1",
    "python-dotenv>=1.2.2",
    "openai>=3.6.0",
    "anthropic>=0.40.0",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
